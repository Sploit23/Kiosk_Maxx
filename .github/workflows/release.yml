name: Build e Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build e publicar release no GitHub
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Garantir release publicado (sair do rascunho)
        shell: pwsh
        run: gh release edit $env:GITHUB_REF_NAME --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}