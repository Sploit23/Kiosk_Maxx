name: Build e Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build instalador (NSIS)
        run: npm run build:win

      - name: Criar e publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $artifacts = Get-ChildItem -Path "release" -File | Where-Object {
            $_.Name -like "*.exe" -or $_.Name -like "*.exe.blockmap" -or $_.Name -eq "latest.yml"
          }
          if (-not $artifacts) { throw "Nenhum artefato encontrado em release/" }
          gh release create $tag $artifacts.FullName --title $tag --generate-notes