name: Build e Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Baixar JRE 8 (x86) para embutir no instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force jre8 | Out-Null
          Invoke-WebRequest -Uri "https://api.adoptium.net/v3/binary/latest/8/ga/windows/x86/jre/hotspot/normal/eclipse?project=jdk" -OutFile jre8/jre8.zip
          Expand-Archive jre8/jre8.zip -DestinationPath jre8 -Force
          $root = Get-ChildItem jre8 -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'bin\java.exe') } | Select-Object -First 1
          if (-not $root) { throw "JRE nao extraido corretamente em jre8/" }
          $target = "jre8/runtime"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item (Join-Path $root.FullName '*') $target -Recurse -Force
          Remove-Item jre8/jre8.zip, $root.FullName -Recurse -Force

      - name: Build instalador (NSIS)
        run: npm run build:win

      - name: Criar e publicar release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $artifacts = Get-ChildItem -Path "release" -File | Where-Object {
            $_.Name -like "*.exe" -or $_.Name -like "*.exe.blockmap" -or $_.Name -eq "latest.yml"
          }
          if (-not $artifacts) { throw "Nenhum artefato encontrado em release/" }
          gh release create $tag $artifacts.FullName --title $tag --generate-notes